[project]
name = "bluesky-dev"
version = "0.1.0"
description = "Pseudo /dev device that posts to Bluesky"
authors = [{ name = "Norbert Szydlik" }]
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "atproto",
    "python-dotenv"
]

[project.scripts]
bluesky-dev = "bluesky_dev.daemon:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

